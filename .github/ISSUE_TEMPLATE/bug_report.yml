name: Bug report
description: Report a reproducible problem in Hibi Lens
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not include private security details here.
  - type: input
    id: app-version
    attributes:
      label: App or source release version
      description: Enter the Hibi Lens version or public repository commit.
      placeholder: 1.0 or a full commit ID
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the device model, iOS version, and Xcode version if you built from source.
      placeholder: iPhone model, iOS version, Xcode version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that shows the problem.
      placeholder: "1. Open ...\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal photos and sensitive information before attaching files.
  - type: checkboxes
    id: security-check
    attributes:
      label: Security check
      options:
        - label: This report does not disclose a security vulnerability.
          required: true
